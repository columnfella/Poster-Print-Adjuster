<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Architectural Poster Frame -->
  <g filter="url(#drop)">
    <!-- Main Paper Ground -->
    <rect x="14" y="10" width="36" height="44" rx="3" fill="url(#paperGrad)" />
    
    <!-- Poster Artwork Preview Lines (Geometric Constructivism) -->
    <!-- Red circle -->
    <circle cx="28" cy="24" r="7" fill="#EF4444" />
    <!-- Blue diagonal bar -->
    <rect x="22" y="31" width="20" height="4" rx="1.5" fill="#2563EB" />
    <!-- Amber accent triangle/block -->
    <polygon points="36,20 44,20 40,28" fill="#F59E0B" />
    
    <!-- 300 DPI Archival Dots Indicator -->
    <circle cx="20" cy="47" r="1.5" fill="#10B981" />
    <circle cx="26" cy="47" r="1.5" fill="#10B981" />
    <circle cx="32" cy="47" r="1.5" fill="#10B981" />
    
    <!-- Print Frame Trim Boundary -->
    <rect x="14" y="10" width="36" height="44" rx="3" stroke="#CBD5E1" stroke-width="1.5" fill="none" />
  </g>
</svg>
